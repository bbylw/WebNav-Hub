<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebNav Hub · 导航中心</title>

  <meta name="description" content="WebNav Hub — 精选 AI 搜索、托管社交、实用工具、科技资讯、云存储与邮箱服务导航。" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0c;
      --bg-elev: #101013;
      --surface: rgba(255, 255, 255, 0.028);
      --surface-hover: rgba(255, 255, 255, 0.055);
      --border: rgba(255, 255, 255, 0.075);
      --border-hover: rgba(255, 160, 40, 0.45);
      --accent: #ffa028;
      --accent-strong: #ff8800;
      --accent-soft: rgba(255, 160, 40, 0.12);
      --text: #f4f3ef;
      --text-dim: #b9b6ad;
      --muted: #83817a;
      --radius: 16px;
      --font-display: "Space Grotesk", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-body: "Space Grotesk", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --nav-h: 58px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100dvh;
      background-image:
        radial-gradient(ellipse 60% 42% at 50% -8%, rgba(255, 140, 20, 0.13), transparent 70%),
        radial-gradient(ellipse 40% 32% at 88% 4%, rgba(120, 80, 255, 0.05), transparent 70%);
      background-repeat: no-repeat;
    }

    ::selection {
      background: rgba(255, 160, 40, 0.35);
      color: #fff;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: #2a2a30;
      border-radius: 8px;
      border: 2px solid var(--bg);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3a3a42;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 6px;
    }

    /* ---------- 阅读进度条 ---------- */
    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      width: 100%;
      z-index: 2000;
      background: linear-gradient(90deg, var(--accent-strong), var(--accent));
      transform-origin: 0 50%;
      transform: scaleX(0);
      will-change: transform;
    }

    /* ---------- Hero ---------- */
    .hero {
      position: relative;
      padding: 4.5rem 1.25rem 3rem;
      text-align: center;
      isolation: isolate;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.032) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.032) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse 62% 68% at 50% 18%, #000 30%, transparent 78%);
      -webkit-mask-image: radial-gradient(ellipse 62% 68% at 50% 18%, #000 30%, transparent 78%);
    }

    .hero::after {
      content: "";
      position: absolute;
      left: 50%;
      top: -140px;
      width: 560px;
      height: 340px;
      transform: translateX(-50%);
      z-index: -1;
      background: radial-gradient(closest-side, rgba(255, 150, 25, 0.16), transparent);
      filter: blur(10px);
      pointer-events: none;
    }

    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.08;
      margin: 0 0 0.9rem;
      text-transform: uppercase;
    }

    .hero h1 .accent {
      background: linear-gradient(115deg, #ffc46a 0%, var(--accent) 45%, var(--accent-strong) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    /* ---------- 搜索框 ---------- */
    .search-wrap {
      position: relative;
      max-width: 560px;
      margin: 0 auto;
    }

    .search-wrap>i.fa-magnifying-glass {
      position: absolute;
      left: 1.05rem;
      top: 50%;
      translate: 0 -50%;
      color: var(--muted);
      font-size: 0.95rem;
      pointer-events: none;
    }

    #search {
      width: 100%;
      height: 52px;
      padding: 0 4.2rem 0 2.9rem;
      font: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--border);
      border-radius: 999px;
      outline: none;
      backdrop-filter: blur(12px);
      transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
    }

    #search::placeholder {
      color: var(--muted);
    }

    #search:hover {
      border-color: rgba(255, 255, 255, 0.16);
    }

    #search:focus {
      border-color: var(--border-hover);
      background: rgba(255, 160, 40, 0.06);
      box-shadow: 0 0 0 4px rgba(255, 160, 40, 0.12);
    }

    .search-kbd {
      position: absolute;
      right: 0.95rem;
      top: 50%;
      translate: 0 -50%;
      pointer-events: none;
    }

    .search-kbd kbd {
      display: inline-block;
      min-width: 22px;
      padding: 0.15rem 0.4rem;
      font-family: inherit;
      font-size: 0.72rem;
      text-align: center;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 6px;
    }

    .hero-stats {
      display: none;
    }

    /* ---------- 吸顶导航 ---------- */
    .site-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(10, 10, 12, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
    }

    .site-nav ul {
      list-style: none;
      display: inline-flex;
      gap: 0.35rem;
      margin: 0;
      padding: 0.55rem 1rem;
      max-width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .site-nav ul::-webkit-scrollbar {
      display: none;
    }

    .site-nav li {
      flex-shrink: 0;
    }

    .site-nav a {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.42rem 0.95rem;
      border-radius: 999px;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: color 0.25s, background 0.25s, border-color 0.25s;
    }

    .site-nav a i {
      font-size: 0.82rem;
      opacity: 0.75;
    }

    .site-nav a:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .site-nav a.active {
      color: #14100a;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      border-color: rgba(255, 190, 90, 0.5);
      box-shadow: 0 4px 18px rgba(255, 145, 20, 0.28);
    }

    .site-nav a.active i {
      opacity: 1;
    }

    /* ---------- 主内容 ---------- */
    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0.5rem 1.25rem 3rem;
    }

    section.category {
      scroll-margin-top: calc(var(--nav-h) + 18px);
      padding-top: 2.2rem;
    }

    .section-head {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 1.25rem;
    }

    .section-icon {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 11px;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid rgba(255, 160, 40, 0.22);
      font-size: 0.95rem;
    }

    .section-head h2 {
      font-family: var(--font-display);
      font-size: 1.28rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0;
    }

    .section-desc {
      color: var(--muted);
      font-size: 0.82rem;
      margin: 0;
    }

    .head-line {
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, rgba(255, 160, 40, 0.35), rgba(255, 255, 255, 0.06) 60%, transparent);
      min-width: 24px;
    }

    /* ---------- 卡片网格 ---------- */
    .link-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
      gap: 0.85rem;
    }

    .link-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 118px;
      padding: 1.15rem 0.7rem 0.95rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      opacity: 0;
      transform: translateY(16px);
      transition:
        opacity 0.55s var(--ease-out),
        transform 0.55s var(--ease-out),
        background 0.3s,
        border-color 0.3s,
        box-shadow 0.3s;
      contain: layout style paint;
    }

    .link-card.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    /* 聚光灯跟随光标 */
    .link-card::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.35s;
      background: radial-gradient(180px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 165, 50, 0.14), transparent 65%);
      pointer-events: none;
    }

    .link-card:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      transform: translateY(-3px);
      box-shadow: 0 12px 28px -12px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 160, 40, 0.06);
    }

    .link-card:hover::before {
      opacity: 1;
    }

    .link-card>a.card-link {
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: inherit;
    }

    .icon-box {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      margin-bottom: 0.7rem;
      border-radius: 13px;
      background: rgba(255, 160, 40, 0.09);
      border: 1px solid rgba(255, 160, 40, 0.18);
      transition: transform 0.35s var(--ease-out), background 0.3s, box-shadow 0.3s;
    }

    .icon-box i {
      font-size: 1.25rem;
      color: var(--accent);
    }

    .link-card:hover .icon-box {
      transform: scale(1.1) translateY(-2px);
      background: rgba(255, 160, 40, 0.16);
      box-shadow: 0 6px 18px -6px rgba(255, 145, 20, 0.5);
    }

    .link-card h3 {
      margin: 0;
      padding: 0 0.25rem;
      font-size: 0.86rem;
      font-weight: 500;
      line-height: 1.35;
      color: var(--text);
      height: 2.7em;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      transition: color 0.25s;
    }

    .link-card:hover h3 {
      color: #ffd9a3;
    }

    /* ---------- 搜索结果提示 / 空状态 ---------- */
    .result-info {
      display: none;
      align-items: center;
      gap: 0.6rem;
      margin: 1.6rem 0 0.4rem;
      color: var(--text-dim);
      font-size: 0.88rem;
    }

    .result-info.show {
      display: flex;
    }

    .result-info button {
      font: inherit;
      font-size: 0.78rem;
      color: var(--accent);
      background: none;
      border: 1px solid rgba(255, 160, 40, 0.35);
      border-radius: 999px;
      padding: 0.2rem 0.85rem;
      cursor: pointer;
      transition: background 0.25s;
    }

    .result-info button:hover {
      background: var(--accent-soft);
    }

    .empty-state {
      display: none;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
    }

    .empty-state.show {
      display: block;
    }

    .empty-state i {
      font-size: 2.2rem;
      color: #3c3c44;
      margin-bottom: 0.8rem;
      display: block;
    }

    .empty-state p {
      margin: 0.2rem 0;
      font-size: 0.92rem;
    }

    .empty-state span {
      font-size: 0.8rem;
      opacity: 0.75;
    }

    /* ---------- 返回顶部 ---------- */
    #backTop {
      position: fixed;
      right: 1.4rem;
      bottom: 1.6rem;
      z-index: 1500;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      color: var(--accent);
      background: rgba(18, 18, 21, 0.85);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px) scale(0.92);
      transition: opacity 0.35s, transform 0.35s var(--ease-out), visibility 0.35s, border-color 0.25s, background 0.25s;
    }

    #backTop.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    #backTop:hover {
      background: var(--accent-soft);
      border-color: var(--border-hover);
    }

    /* ---------- 页脚 ---------- */
    footer {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      background: linear-gradient(180deg, transparent, rgba(255, 150, 25, 0.035));
      text-align: center;
      padding: 2.2rem 1rem 2.4rem;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .footer-brand {
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: 0.02em;
      font-size: 0.95rem;
      color: var(--text-dim);
      margin-bottom: 0.4rem;
    }

    .footer-brand .accent {
      color: var(--accent);
    }

    footer nav {
      margin-top: 0.9rem;
      display: flex;
      justify-content: center;
      gap: 0.4rem;
    }

    footer nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.78rem;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      transition: color 0.25s, background 0.25s;
    }

    footer nav a:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    /* ---------- 响应式 ---------- */
    @media (max-width: 768px) {
      .hero {
        padding: 3.2rem 1rem 2.4rem;
      }

      main {
        padding: 0.4rem 0.9rem 2.4rem;
      }

      .link-grid {
        grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
        gap: 0.7rem;
      }

      .link-card {
        min-height: 106px;
        padding: 0.95rem 0.5rem 0.8rem;
      }

      .icon-box {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        margin-bottom: 0.55rem;
      }

      .icon-box i {
        font-size: 1.05rem;
      }

      .link-card h3 {
        font-size: 0.8rem;
      }

      .section-head {
        flex-wrap: wrap;
        row-gap: 0.3rem;
      }

      .section-desc {
        display: none;
      }
    }

    @media (max-width: 420px) {
      .link-grid {
        grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
        gap: 0.6rem;
      }

      .link-card {
        min-height: 96px;
      }

      #backTop {
        right: 1rem;
        bottom: 1.2rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .link-card {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

  <header class="hero">

    <div class="search-wrap">

          </div>
          <span class="head-line" aria-hidden="true"></span>
        </div>

          <div class="link-card" data-name="${name.toLowerCase()}" data-url="${url.toLowerCase()}">
            <a class="card-link" href="${url}" target="_blank" rel="noopener noreferrer" aria-label="${name}"></a>
            <span class="icon-box"><i class="${icon}" aria-hidden="true"></i></span>

    /* ================= 滚动显现 ================= */
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const cards = [...document.querySelectorAll(".link-card")];

    if (!reduceMotion && "IntersectionObserver" in window) {
      const io = new IntersectionObserver(entries => {
        let batchIndex = 0;
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const el = entry.target;
            el.style.transitionDelay = `${Math.min(batchIndex++ * 45, 360)}ms`;
            el.classList.add("revealed");
            io.unobserve(el);
            setTimeout(() => (el.style.transitionDelay = ""), 700);
          }
        });
      }, { threshold: 0.08, rootMargin: "0px 0px -6% 0px" });
      cards.forEach(el => io.observe(el));
    } else {
      cards.forEach(el => el.classList.add("revealed"));
    }

    /* ================= Scrollspy ================= */
    const navAnchors = [...document.querySelectorAll("#navList a")];
    const setActive = id => {
      navAnchors.forEach(a => {
        const on = a.getAttribute("href") === `#${id}`;
        a.classList.toggle("active", on);
        if (on) a.scrollIntoView({ block: "nearest", inline: "nearest" });
      });
    };

    const spy = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) setActive(e.target.id);
      });
    }, { rootMargin: "-30% 0px -60% 0px" });

    CATEGORIES.forEach(c => {
      const sec = document.getElementById(c.id);
      if (sec) spy.observe(sec);
    });

    /* 初始 hash 定位 */
    if (location.hash) setActive(location.hash.slice(1));

    /* ================= 聚光灯效果 ================= */
    document.addEventListener("pointermove", e => {
      const card = e.target.closest(".link-card");
      if (!card || matchMedia("(pointer: coarse)").matches) return;
      const r = card.getBoundingClientRect();
      card.style.setProperty("--mx", `${e.clientX - r.left}px`);
      card.style.setProperty("--my", `${e.clientY - r.top}px`);
    }, { passive: true });

    /* ================= 搜索过滤 ================= */
    const searchInput = document.getElementById("search");
    const resultInfo = document.getElementById("resultInfo");
    const emptyState = document.getElementById("emptyState");

    function applyFilter() {
      const q = searchInput.value.trim().toLowerCase();
      let visibleTotal = 0;

      CATEGORIES.forEach(cat => {
        const section = document.getElementById(cat.id);
        let visibleInCat = 0;
        section.querySelectorAll(".link-card").forEach(card => {
          const hit = !q || card.dataset.name.includes(q) || card.dataset.url.includes(q);
          card.style.display = hit ? "" : "none";
          if (hit) visibleInCat++;
        });
        section.style.display = visibleInCat ? "" : "none";
        visibleTotal += visibleInCat;
      });

      resultInfo.classList.toggle("show", !!q);
      if (q) resultInfo.innerHTML = `<i class="fa-solid fa-filter" aria-hidden="true"></i> 找到 ${visibleTotal} 个站点 <button type="button" id="clearSearch">清除</button>`;
      emptyState.classList.toggle("show", q && visibleTotal === 0);

      const btn = document.getElementById("clearSearch");
      if (btn) btn.addEventListener("click", () => {
        searchInput.value = "";
        applyFilter();
        searchInput.focus();
      });

      window.scrollTo({ top: window.scrollY > 0 && q ? Math.min(window.scrollY, 320) : window.scrollY });
    }

    searchInput.addEventListener("input", applyFilter);

    /* 快捷键：/ 聚焦搜索，Esc 清除 */
    document.addEventListener("keydown", e => {
      if (e.key === "/" && document.activeElement !== searchInput &&
        !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
        e.preventDefault();
        searchInput.focus();
      } else if (e.key === "Escape" && document.activeElement === searchInput) {
        searchInput.value = "";
        applyFilter();
        searchInput.blur();
      }
    });

    /* ================= 进度条 + 返回顶部 ================= */
    const progressBar = document.getElementById("progressBar");
    const backTop = document.getElementById("backTop");
    let ticking = false;

    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const doc = document.documentElement;
        const max = doc.scrollHeight - doc.clientHeight;
        progressBar.style.transform = `scaleX(${max > 0 ? doc.scrollTop / max : 0})`;
        backTop.classList.toggle("show", doc.scrollTop > 480);
        ticking = false;
      });
    }
    document.addEventListener("scroll", onScroll, { passive: true });
    onScroll();

    backTop.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
    });
  </script>
